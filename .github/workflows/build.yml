name: Build and Release

on:
  push:
    tags:
      - 'v*' # Triggers the build when you push a tag like v1.0.0

jobs:
  release:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    # Crucial fix to prevent 403 Forbidden publishing errors
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Matches your Node environment
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build and Publish Electron App
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder -p always
