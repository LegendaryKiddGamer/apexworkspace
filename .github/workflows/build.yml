name: Build and Release Apex Workspace

on:
  push:
    tags:
      - 'v*' # Triggers the build automatically when you push any version tag (e.g., v1.0.13)

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build and Publish Electron Package
        run: npx electron-builder --publish always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
